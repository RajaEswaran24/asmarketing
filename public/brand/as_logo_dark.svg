<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
  <defs>
    <linearGradient id="asRedLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="100%" stop-color="#C40812" />
    </linearGradient>
    <linearGradient id="emblemBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
  </defs>

  <!-- Monogram Box -->
  <g transform="translate(0, 4)">
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#0B1325" stroke="url(#emblemBorder)" stroke-width="2" />
    
    <!-- Phone outline -->
    <rect x="10" y="8" width="22" height="48" rx="5" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" fill="none" stroke-dasharray="2 2" />
    
    <!-- A -->
    <path d="M 18 48 L 27 16 L 33 16 L 37 30" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 22 36 L 32 36" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- S -->
    <path d="M 46 23 C 46 17, 39 16, 35 19 C 28 23, 26 29, 36 34 C 46 39, 45 47, 39 49 C 33 51, 26 48, 26 43" 
          stroke="url(#asRedLogo)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(74, 10)">
    <!-- AS -->
    <text x="0" y="28" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#FFFFFF">AS</text>
    <!-- MARKETING -->
    <text x="44" y="28" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" letter-spacing="1.5" fill="#FFFFFF">MARKETING</text>
    
    <!-- Red Accent dot/line -->
    <circle cx="270" cy="23" r="4" fill="#E50914" />
    
    <!-- Sub-text -->
    <text x="1" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9.5" letter-spacing="2.2" fill="#94A3B8">MOBILE ACCESSORIES</text>
    <circle cx="152" cy="43" r="2" fill="#00D2FF" />
    <text x="162" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="9.5" letter-spacing="2.2" fill="#E50914">WHOLESALE</text>
  </g>
</svg>
