<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="asRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E38" />
      <stop offset="100%" stop-color="#C40812" />
    </linearGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0B1325" stroke="url(#phoneBorder)" stroke-width="2.5" />
  
  <!-- Subtle Phone Outline Motif -->
  <rect x="18" y="16" width="44" height="88" rx="10" stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none" stroke-dasharray="2 3" />
  <circle cx="40" cy="22" r="2" fill="#00D2FF" />
  
  <!-- Letter 'A' (Modern Tech Form) -->
  <path d="M 34 88 L 52 32 L 64 32 L 72 58" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 42 66 L 62 66" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />

  <!-- Letter 'S' (Dynamic Flowing Crimson Stroke) -->
  <path d="M 88 44 C 88 35, 75 33, 67 38 C 55 45, 50 56, 68 64 C 86 72, 85 86, 73 90 C 62 94, 50 88, 50 78" 
        stroke="url(#asRedGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
